name: Build Goregram Independent Android
on:
  workflow_dispatch:
  push:
    branches:
      - goregram-independent
    paths:
      - 'goregram-android/**'
      - '.github/workflows/build-goregram.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build independent Goregram APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -p goregram-android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Goregram-Independent-debug
          path: goregram-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
