name: Build Goregram Independent Android
on:
  workflow_dispatch:
  push:
    branches:
      - goregram-independent
    paths:
      - 'goregram-android/**'
      - '.github/workflows/build-goregram.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build independent Goregram APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -p goregram-android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Goregram-Independent-debug
          path: goregram-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
